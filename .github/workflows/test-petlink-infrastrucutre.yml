name: test-petlink-infrastrucutre

on:
  push:
    branches: [develop]

  # CASO 2: Trigger Esterno (Da Core/Sentinel/ecc)
  workflow_dispatch:
    inputs:
      repo: { description: "Source Repo", required: true }
      branch: { description: "Source Branch", required: true }
      sha: { description: "Source SHA", required: true }
      actor: { description: "Source Actor", required: true }

concurrency:
  # Create a unique concurrency group based on workflow name and target branch (environment)
  # 1. If two runs start on 'develop', the second one is queued until the first completes.
  # 2. If runs start on different branches (e.g., 'develop' vs 'feature-x'), they run in parallel.
  group: ${{ github.workflow }}-${{ github.event.inputs.branch || github.ref_name || 'develop' }}
  # false = Do not cancel the in-progress run, but queue the new one instead
  # true = cancel the in-progress run (useful when some change need deploy of more microservices, deployed sequentially)
  cancel-in-progress: true

env:
  DOCKER_IMAGE_NAME: petlink-everywhere-test
  DOCKER_IMAGE_ARTIFACT: petlink-test-image

jobs:
  info-job:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.branch == 'test' }}

    steps:
      - name: Add Trigger Info to Summary
        run: |
          echo "## 🔔 Info Trigger Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             # --- EXTERNAL (by push on repos of architecture) ---
             REPO="${{ github.event.inputs.repo }}"
             BRANCH="${{ github.event.inputs.branch }}"
             SHA="${{ github.event.inputs.sha }}"
             ACTOR="${{ github.event.inputs.actor }}"

             echo "**Triggered by:** 🚀 Push on External Repo" >> $GITHUB_STEP_SUMMARY
             echo "**Source Repo:** [\`${REPO}\`](https://github.com/${REPO})" >> $GITHUB_STEP_SUMMARY
             echo "**Source Branch:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Target Env Tests:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Commit:** [\`${SHA:0:7}\`](https://github.com/${REPO}/commit/${SHA})" >> $GITHUB_STEP_SUMMARY
             echo "**Author:** @${ACTOR}" >> $GITHUB_STEP_SUMMARY

          elif [ "${{ github.event_name }}" = "push" ]; then
             # --- INTERNAL (by push on test suite) ---
             REPO="${{ github.repository }}"
             BRANCH="${{ github.ref_name }}"
             SHA="${{ github.sha }}"
             ACTOR="${{ github.actor }}"

             echo "**Trigger:** 📝 Push on Test Suite" >> $GITHUB_STEP_SUMMARY
             echo "**Source Repo:** [\`${REPO}\`](https://github.com/${REPO})" >> $GITHUB_STEP_SUMMARY
             echo "**Source Branch:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Target Env Tests:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Commit:** [\`${SHA:0:7}\`](https://github.com/${REPO}/commit/${SHA})" >> $GITHUB_STEP_SUMMARY
             echo "**Author:** @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          fi
  

  build-image:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.branch == 'test' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t ${{ env.DOCKER_IMAGE_NAME }} .

      - name: Save Docker image to artifact
        run: |
          docker save ${{ env.DOCKER_IMAGE_NAME }} -o ${{ env.DOCKER_IMAGE_ARTIFACT }}.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DOCKER_IMAGE_ARTIFACT }}
          path: |
            ${{ env.DOCKER_IMAGE_ARTIFACT }}.tar
          retention-days: 1

  run-tests:
    needs: build-image
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || github.event.inputs.branch == 'test' }}
    # ENVIRONMENT DETERMINISTICO:
    # Se workflow_dispatch -> Usa ESATTAMENTE inputs.branch (se non esiste env -> crash)
    # Se push -> Usa ESATTAMENTE ref_name (il branch su cui hai pushato)
    environment: ${{ github.event.inputs.branch || github.ref_name || 'develop' }}

    env:
      ENV: ${{ github.event.inputs.branch || github.ref_name || 'develop' }}
      # Core API
      CORE_GRAPHQL_API_URL: ${{ secrets.CORE_GRAPHQL_API_URL }}
      CORE_GRAPHQL_API_KEY: ${{ secrets.CORE_GRAPHQL_API_KEY }}
      # Core REST API (order manager)
      CORE_REST_API_URL: ${{ secrets.CORE_REST_API_URL }}
      CORE_REST_BASIC_AUTH_USERNAME: ${{ secrets.CORE_REST_BASIC_AUTH_USERNAME }}
      CORE_REST_BASIC_AUTH_PASSWORD: ${{ secrets.CORE_REST_BASIC_AUTH_PASSWORD }}
      # CCT API
      CCT_GRAPHQL_API_URL: ${{ secrets.CCT_GRAPHQL_API_URL }}
      CCT_GRAPHQL_API_KEY: ${{ secrets.CCT_GRAPHQL_API_KEY }}
      # AWS Cognito
      COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
      COGNITO_CLIENT_ID_APP_USER: ${{ secrets.COGNITO_CLIENT_ID_APP_USER }}
      COGNITO_CLIENT_ID_FE_CCT: ${{ secrets.COGNITO_CLIENT_ID_FE_CCT }}
      # USER (app) credentials login
      USER_APP_NAME: ${{ secrets.USER_APP_NAME }}
      USER_APP_SURNAME: ${{ secrets.USER_APP_SURNAME }}
      USER_APP_PASSWORD: ${{ secrets.USER_APP_PASSWORD }}
      # OPERATOR (cct) credentials login
      OPERATOR_CCT_EMAIL: ${{ secrets.OPERATOR_CCT_EMAIL }}
      OPERATOR_CCT_PASSWORD: ${{ secrets.OPERATOR_CCT_PASSWORD }}
      OPERATOR_CCT_PHONE: ${{ secrets.OPERATOR_CCT_PHONE }}
      # AWS IAM
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_CORE_ACCESS_KEY_ID: ${{ secrets.AWS_CORE_ACCESS_KEY_ID }}
      AWS_CORE_SECRET_ACCESS_KEY: ${{ secrets.AWS_CORE_SECRET_ACCESS_KEY }}
      AWS_CCT_ACCESS_KEY_ID: ${{ secrets.AWS_CCT_ACCESS_KEY_ID }}
      AWS_CCT_SECRET_ACCESS_KEY: ${{ secrets.AWS_CCT_SECRET_ACCESS_KEY }}
      # Twilio
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_USER_PHONE_NUMBER: ${{ secrets.TWILIO_USER_PHONE_NUMBER }}
      # Gmail
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      GMAIL_USER_EMAIL: ${{ secrets.GMAIL_USER_EMAIL }}
      # App Brand
      APP_BRAND: ${{ matrix.app_brand }}
      # Sentinel socket tcp
      SENTINEL_HOST: ${{ secrets.SENTINEL_HOST }}
      SENTINEL_PORT: ${{ secrets.SENTINEL_PORT }}
      # Sentinel mongodb
      SENTINEL_MONGO_HOST: ${{ secrets.SENTINEL_MONGO_HOST }}
      SENTINEL_MONGO_USER: ${{ secrets.SENTINEL_MONGO_USER }}
      SENTINEL_MONGO_PASSWORD: ${{ secrets.SENTINEL_MONGO_PASSWORD }}
      SENTINEL_MONGO_DATABASE: ${{ secrets.SENTINEL_MONGO_DATABASE }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app_brand: [PETLINK, KIPPY]

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Docker image artifact
        uses: actions/download-artifact@v7
        with:
          name: ${{ env.DOCKER_IMAGE_ARTIFACT }}

      - name: Load Docker image
        run: docker load -i ${{ env.DOCKER_IMAGE_ARTIFACT }}.tar

      - name: Run integration tests (${{ matrix.app_brand }} on env ${{ env.ENV }})
        run: |
          # Crea directory per estrarre i report (separata per ogni brand)
          mkdir -p ./test-reports-${{ matrix.app_brand }}

          # Esegui i test nel container con volume mapping per estrarre i report
          docker run \
            -e CORE_GRAPHQL_API_URL \
            -e CORE_GRAPHQL_API_KEY \
            -e CORE_REST_API_URL \
            -e CORE_REST_BASIC_AUTH_USERNAME \
            -e CORE_REST_BASIC_AUTH_PASSWORD \
            -e CCT_GRAPHQL_API_URL \
            -e CCT_GRAPHQL_API_KEY \
            -e COGNITO_REGION \
            -e COGNITO_CLIENT_ID_APP_USER \
            -e COGNITO_CLIENT_ID_FE_CCT \
            -e USER_APP_NAME \
            -e USER_APP_SURNAME \
            -e USER_APP_PASSWORD \
            -e OPERATOR_CCT_EMAIL \
            -e OPERATOR_CCT_PASSWORD \
            -e OPERATOR_CCT_PHONE \
            -e AWS_REGION \
            -e AWS_CORE_ACCESS_KEY_ID \
            -e AWS_CORE_SECRET_ACCESS_KEY \
            -e AWS_CCT_ACCESS_KEY_ID \
            -e AWS_CCT_SECRET_ACCESS_KEY \
            -e TWILIO_ACCOUNT_SID \
            -e TWILIO_AUTH_TOKEN \
            -e TWILIO_USER_PHONE_NUMBER \
            -e GMAIL_CLIENT_ID \
            -e GMAIL_CLIENT_SECRET \
            -e GMAIL_REFRESH_TOKEN \
            -e GMAIL_USER_EMAIL \
            -e APP_BRAND \
            -e SENTINEL_HOST \
            -e SENTINEL_PORT \
            -e SENTINEL_MONGO_HOST \
            -e SENTINEL_MONGO_USER \
            -e SENTINEL_MONGO_PASSWORD \
            -e SENTINEL_MONGO_DATABASE \
            -e ENV \
            -v $(pwd)/test-reports-${{ matrix.app_brand }}:/app/test-reports \
            ${{ env.DOCKER_IMAGE_NAME }} yarn pipeline:$ENV

      # Pubblica JUnit report per annotazioni su PR
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v6
        if: always()
        with:
          report_paths: "test-reports-${{ matrix.app_brand }}/junit.xml"
          check_name: "Report (test ${{ matrix.app_brand }} on ${{ env.ENV }})"
          fail_on_failure: true
          require_tests: true
          # Summary (pagina "Summary" del run su Actions)
          job_summary: true
          detailed_summary: true
          verbose_summary: true
          group_suite: true
          # Check (pagina dedicata del "Check" creato dall’action, visibile anche in PR)



  notify-discord:
    needs: [run-tests]
    if: always() && github.event_name == 'workflow_dispatch' && github.event.inputs.branch == 'test' && needs.run-tests.result != 'skipped'
    runs-on: ubuntu-latest
    # Environment is required to access Secrets
    environment: ${{ github.event.inputs.branch || github.ref_name || 'develop' }}

    steps:
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          WORKFLOW_STATUS: ${{ needs.run-tests.result }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BRANCH="${{ github.ref_name }}"

          if [ "$WORKFLOW_STATUS" == "success" ]; then
             TITLE="✅ Pipeline Tests PASSED"
             COLOR=3066993 # Green
             DESCRIPTION="All integration tests (PETLINK & KIPPY) passed successfully."
             MENTION=""
          else
             TITLE="🚨 Pipeline Tests FAILED"
             COLOR=15158332 # Red
             DESCRIPTION="Some tests failed. Check the full report for details."
             MENTION="${DISCORD_MENTION}"
          fi

          # Build simple JSON payload
          jq -n \
            --arg content "$MENTION" \
            --arg title "$TITLE" \
            --arg desc "$DESCRIPTION" \
            --arg color "$COLOR" \
            --arg url "$RUN_URL" \
            --arg branch "$BRANCH" \
            '{
              content: $content,
              username: "Integration Test",
              embeds: [{
                title: $title,
                description: $desc,
                color: ($color | tonumber),
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Report", value: ("[🔗 Open Summary](" + $url + ")"), inline: true }
                ]
              }]
            }' > discord_payload.json
            
          curl -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK_URL"
