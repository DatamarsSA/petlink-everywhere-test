name: test-petlink-infrastrucutre

on:
  push:
    branches: [develop]

  # CASO 2: Trigger Esterno (Da Core/Sentinel/ecc)
  workflow_dispatch:
    inputs:
      repo: { description: "Source Repo", required: true }
      branch: { description: "Source Branch", required: true }
      sha: { description: "Source SHA", required: true }
      actor: { description: "Source Actor", required: true }

jobs:
  info-job:
    runs-on: ubuntu-latest
    steps:

      - name: Add Trigger Info to Summary
        run: |
          echo '${{ toJSON(github.event) }}' 
          echo "## 🔔 Info Trigger Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
             # --- EXTERNAL (by push on repos of architecture) ---
             REPO="${{ github.event.inputs.repo }}"
             BRANCH="${{ github.event.inputs.branch }}"
             SHA="${{ github.event.inputs.sha }}"
             ACTOR="${{ github.event.inputs.actor }}"

             echo "**Triggered by:** 🚀 Push on External Repo" >> $GITHUB_STEP_SUMMARY
             echo "**Source Repo:** [\`${REPO}\`](https://github.com/${REPO})" >> $GITHUB_STEP_SUMMARY
             echo "**Source Branch:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Target Env Tests:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Commit:** [\`${SHA:0:7}\`](https://github.com/${REPO}/commit/${SHA})" >> $GITHUB_STEP_SUMMARY
             echo "**Author:** @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          
          elif [ "${{ github.event_name }}" = "push" ]; then
             # --- INTERNAL (by push on test suite) ---
             REPO="${{ github.repository }}"
             BRANCH="${{ github.ref_name }}"
             SHA="${{ github.sha }}"
             ACTOR="${{ github.actor }}"

             echo "**Trigger:** 📝 Push on Test Suite" >> $GITHUB_STEP_SUMMARY
             echo "**Source Repo:** [\`${REPO}\`](https://github.com/${REPO})" >> $GITHUB_STEP_SUMMARY
             echo "**Source Branch:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Target Env Tests:** \`${BRANCH}\`" >> $GITHUB_STEP_SUMMARY
             echo "**Commit:** [\`${SHA:0:7}\`](https://github.com/${REPO}/commit/${SHA})" >> $GITHUB_STEP_SUMMARY
             echo "**Author:** @${ACTOR}" >> $GITHUB_STEP_SUMMARY
          fi


  run-tests:
    runs-on: ubuntu-latest
    # ENVIRONMENT DETERMINISTICO:
    # Se workflow_dispatch -> Usa ESATTAMENTE inputs.branch (se non esiste env -> crash)
    # Se push -> Usa ESATTAMENTE ref_name (il branch su cui hai pushato)
    environment: ${{ github.event.inputs.branch || github.ref_name || 'develop' }}

    env:
      NODE_ENV: ${{ github.event.inputs.branch || github.ref_name || 'develop' }}
      # Core API
      CORE_GRAPHQL_API_URL: ${{ secrets.CORE_GRAPHQL_API_URL }}
      CORE_GRAPHQL_API_KEY: ${{ secrets.CORE_GRAPHQL_API_KEY }}
      # CCT API
      CCT_GRAPHQL_API_URL: ${{ secrets.CCT_GRAPHQL_API_URL }}
      CCT_GRAPHQL_API_KEY: ${{ secrets.CCT_GRAPHQL_API_KEY }}
      # AWS Cognito
      COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
      COGNITO_CLIENT_ID_APP_USER: ${{ secrets.COGNITO_CLIENT_ID_APP_USER }}
      COGNITO_CLIENT_ID_FE_CCT: ${{ secrets.COGNITO_CLIENT_ID_FE_CCT }}
      # AWS IAM
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Twilio
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      # Gmail
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # App Brand
      APP_BRAND: ${{ matrix.app_brand }}
      # Sentinel socket tcp
      SENTINEL_HOST: ${{ secrets.SENTINEL_HOST }}
      SENTINEL_PORT: ${{ secrets.SENTINEL_PORT }}
      # Sentinel mongodb
      SENTINEL_MONGO_HOST: ${{ secrets.SENTINEL_MONGO_HOST }}
      SENTINEL_MONGO_USER: ${{ secrets.SENTINEL_MONGO_USER }}
      SENTINEL_MONGO_PASSWORD: ${{ secrets.SENTINEL_MONGO_PASSWORD }}
      SENTINEL_MONGO_DATABASE: ${{ secrets.SENTINEL_MONGO_DATABASE }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app_brand: [PETLINK, KIPPY]

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t petlink-everywhere-test .

      - name: Run integration tests (${{ matrix.app_brand }} on env ${{ env.NODE_ENV }})
        run: |
          # Crea directory per estrarre i report (separata per ogni brand)
          mkdir -p ./test-reports-${{ matrix.app_brand }}

          # Esegui i test nel container con volume mapping per estrarre i report
          docker run \
            -e CORE_GRAPHQL_API_URL \
            -e CORE_GRAPHQL_API_KEY \
            -e CCT_GRAPHQL_API_URL \
            -e CCT_GRAPHQL_API_KEY \
            -e COGNITO_REGION \
            -e COGNITO_CLIENT_ID_APP_USER \
            -e COGNITO_CLIENT_ID_FE_CCT \
            -e AWS_REGION \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TWILIO_ACCOUNT_SID \
            -e TWILIO_AUTH_TOKEN \
            -e GMAIL_CLIENT_ID \
            -e GMAIL_CLIENT_SECRET \
            -e GMAIL_REFRESH_TOKEN \
            -e APP_BRAND \
            -e SENTINEL_HOST \
            -e SENTINEL_PORT \
            -e SENTINEL_MONGO_HOST \
            -e SENTINEL_MONGO_USER \
            -e SENTINEL_MONGO_PASSWORD \
            -e SENTINEL_MONGO_DATABASE \
            -e NODE_ENV \
            -v $(pwd)/test-reports-${{ matrix.app_brand }}:/app/test-reports \
            petlink-everywhere-test yarn pipeline:$NODE_ENV


      # Pubblica JUnit report per annotazioni su PR
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "test-reports-${{ matrix.app_brand }}/junit.xml"
          check_name: "Report (test ${{ matrix.app_brand }} on ${{ env.NODE_ENV }})"
          fail_on_failure: true
          require_tests: true
          # Summary (pagina "Summary" del run su Actions)
          job_summary: true
          detailed_summary: true
          verbose_summary: true
          group_suite: true
          # Check (pagina dedicata del "Check" creato dall’action, visibile anche in PR)
          annotations_limit: 200
          include_passed: false

      # Add Performance Report to Summary
      - name: Add Performance Report to Summary
        if: always()
        run: |
          if [ -f "test-reports-${{ matrix.app_brand }}/performance-report.txt" ]; then
            echo "## 🚀 Performance Report (${{ matrix.app_brand }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-reports-${{ matrix.app_brand }}/performance-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Performance report not found" >> $GITHUB_STEP_SUMMARY
          fi


      # -------------------------------------------------
      # 1. Prepare Stats for Notification (JSON clean extraction)
      # -------------------------------------------------
      - name: Export Test Stats
        if: always()
        run: |
          # Calculate duration specific to this Brand
          END_TS=$(date +%s)
          START_TS="${JOB_START_TS:-$END_TS}"
          DURATION=$((END_TS - START_TS))
          DURATION_FMT="$(($DURATION / 60))m $(($DURATION % 60))s"
          
          REPORT_FILE="test-reports-${{ matrix.app_brand }}/results.json"
          
          # If the report exists, extract clean data. Otherwise report build error.
          if [ -f "$REPORT_FILE" ]; then
            jq -n \
              --arg brand "${{ matrix.app_brand }}" \
              --arg duration "$DURATION_FMT" \
              --slurpfile results "$REPORT_FILE" \
              '{
                brand: $brand,
                duration: $duration,
                total: $results[0].numTotalTests,
                passed: $results[0].numPassedTests,
                failed: $results[0].numFailedTests,
                skipped: $results[0].numPendingTests
              }' > stats-${{ matrix.app_brand }}.json
          else
            echo '{ "brand": "${{ matrix.app_brand }}", "error": "Build/Test Crash" }' > stats-${{ matrix.app_brand }}.json
          fi

      # -------------------------------------------------
      # 2. Upload Artifact (Pass stats to the notify job)
      # -------------------------------------------------
      - name: Upload Stats
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stats-${{ matrix.app_brand }}
          path: stats-${{ matrix.app_brand }}.json
          retention-days: 1


  # -------------------------------------------------
  # JOB: Notify Discord (Fan-In)
  # -------------------------------------------------
  notify-discord:
    needs: [run-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all stats
        uses: actions/download-artifact@v4
        with:
          pattern: stats-*
          merge-multiple: true
          
      - name: Send Discord Notification
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ secrets.DISCORD_MENTION }}
          WORKFLOW_STATUS: ${{ needs.run-tests.result }}
        run: |
          STATS_TEXT=""
          HAS_FAILURE=false
          
          # Loop through all downloaded stats files
          for file in stats-*.json; do
            BRAND=$(jq -r '.brand' $file)
            ERROR=$(jq -r '.error // empty' $file)
            
            if [ ! -z "$ERROR" ]; then
              STATS_TEXT+="${BRAND}: ⚠️ CRASH/BUILD FAILED\n"
              HAS_FAILURE=true
            else
              TOTAL=$(jq -r '.total' $file)
              PASSED=$(jq -r '.passed' $file)
              FAILED=$(jq -r '.failed' $file)
              SKIPPED=$(jq -r '.skipped' $file)
              DURATION=$(jq -r '.duration' $file)
              
              if [ "$FAILED" -gt 0 ]; then
                ICON="❌"
                HAS_FAILURE=true
              else
                ICON="✅"
              fi
              
              STATS_TEXT+="${ICON} **${BRAND}** (${DURATION})\n"
              STATS_TEXT+="   Total: ${TOTAL} | Passed: ${PASSED} | Skipped: ${SKIPPED} | Failed: **${FAILED}**\n\n"
            fi
          done

          if [ "$HAS_FAILURE" = true ] || [ "$WORKFLOW_STATUS" == "failure" ]; then
             TITLE="🚨 Pipeline Tests FAILED"
             COLOR=15158332 # Red
             MENTION="${DISCORD_MENTION}"
          else
             TITLE="✅ Pipeline Tests PASSED"
             COLOR=3066993 # Green
             MENTION=""
          fi
          
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          jq -n \
            --arg content "$MENTION" \
            --arg title "$TITLE" \
            --arg color "$COLOR" \
            --arg stats "$(echo -e "$STATS_TEXT")" \
            --arg runUrl "$RUN_URL" \
            --arg branch "${{ github.ref_name }}" \
            '{
              content: $content,
              username: "Integration Test",
              embeds: [{
                title: $title,
                color: ($color | tonumber),
                description: $stats,
                fields: [
                  { name: "Branch", value: $branch, inline: true },
                  { name: "Full Report", value: ("[🔗 Open Summary](" + $runUrl + ")"), inline: true }
                ]
              }]
            }' > discord_payload.json
            
          curl -H "Content-Type: application/json" -X POST -d @discord_payload.json "$DISCORD_WEBHOOK_URL"