name: test-petlink-infrastrucutre

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - test

jobs:
  run-integration-tests:
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write
      contents: read
    # Usa l'ambiente specificato nell'input o 'develop' se non specificato
    environment: ${{ github.event.inputs.environment || 'develop' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t petlink-everywhere-test .

      - name: Run integration tests
        env:
          # Core API
          CORE_GRAPHQL_API_URL: ${{ secrets.CORE_GRAPHQL_API_URL }}
          CORE_GRAPHQL_API_KEY: ${{ secrets.CORE_GRAPHQL_API_KEY }}
          # CCT API
          CCT_GRAPHQL_API_URL: ${{ secrets.CCT_GRAPHQL_API_URL }}
          CCT_GRAPHQL_API_KEY: ${{ secrets.CCT_GRAPHQL_API_KEY }}
          # AWS Cognito
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          # AWS IAM
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Twilio
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          # Gmail
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # Imposta NODE_ENV in base all'ambiente selezionato
          NODE_ENV: ${{ github.event.inputs.environment || 'develop' }}
        run: |
          # Crea directory per estrarre i report
          mkdir -p ./test-reports
          
          # Esegui i test nel container con volume mapping per estrarre i report
          docker run \
            -e CORE_GRAPHQL_API_URL \
            -e CORE_GRAPHQL_API_KEY \
            -e CCT_GRAPHQL_API_URL \
            -e CCT_GRAPHQL_API_KEY \
            -e COGNITO_REGION \
            -e COGNITO_CLIENT_ID \
            -e AWS_REGION \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TWILIO_ACCOUNT_SID \
            -e TWILIO_AUTH_TOKEN \
            -e GMAIL_CLIENT_ID \
            -e GMAIL_CLIENT_SECRET \
            -e GMAIL_REFRESH_TOKEN \
            -e NODE_ENV \
            -v $(pwd)/test-reports:/app/test-reports \
            petlink-everywhere-test yarn pipeline:$NODE_ENV

      # Upload test reports come artifacts (sempre, anche se i test falliscono)
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()  # Importante: carica anche se i test falliscono
        with:
          name: test-reports-${{ github.event.inputs.environment || 'develop' }}
          path: test-reports/
          retention-days: 30

      # Pubblica JUnit report per annotazioni su PR
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'test-reports/junit.xml'
          check_name: "Report integration test (${{ github.event.inputs.environment || 'develop' }})"
          fail_on_failure: true
          require_tests: true

          # Summary (pagina "Summary" del run su Actions)
          job_summary: true          # aggiunge un box nel job summary con i risultati (pass/fail/skip)
          detailed_summary: true     # arricchisce il box con tabella leggibile (test falliti con nomi e durata)
          simplified_summary: false  # se true mostra solo numeri; false = mostra dettagli completi
          verbose_summary: true      # include messaggi di errore e stack trace nel summary (più verboso)

          # Check (pagina dedicata del "Check" creato dall’action, visibile anche in PR)
          check_annotations: 'failed' # crea annotazioni solo per i test falliti (all = tutti, none = nessuno)
          annotations_limit: 50       # max annotazioni per check (GitHub ha limite hard 50)
          update_check: true          # aggiorna il check esistente invece di aprirne uno nuovo ogni run
          truncate_stack_traces: false # mostra stack trace completi invece di troncarli
          include_passed: false       # evita di riportare anche i test passati (meno rumore)
          group_suite: true           # raggruppa i test per suite (es. blocchi describe) nella tabella del check
