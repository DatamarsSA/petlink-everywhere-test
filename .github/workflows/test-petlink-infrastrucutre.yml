name: test-petlink-infrastrucutre

on:
  push:
    branches: [ develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test against'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - test

jobs:
  run-integration-tests:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'develop' }}
    
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app_brand: [PETLINK, KIPPY]

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t petlink-everywhere-test .

      - name: Run integration tests (${{ matrix.app_brand }})
        env:
          # Core API
          CORE_GRAPHQL_API_URL: ${{ secrets.CORE_GRAPHQL_API_URL }}
          CORE_GRAPHQL_API_KEY: ${{ secrets.CORE_GRAPHQL_API_KEY }}
          # CCT API
          CCT_GRAPHQL_API_URL: ${{ secrets.CCT_GRAPHQL_API_URL }}
          CCT_GRAPHQL_API_KEY: ${{ secrets.CCT_GRAPHQL_API_KEY }}
          # AWS Cognito
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
          # AWS IAM
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          # Twilio
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          # Gmail
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          # App Brand
          APP_BRAND: ${{ matrix.app_brand }}
          # Imposta NODE_ENV in base all'ambiente selezionato
          NODE_ENV: ${{ github.event.inputs.environment || 'develop'  }}
        run: |
          # Crea directory per estrarre i report (separata per ogni brand)
          mkdir -p ./test-reports-${{ matrix.app_brand }}
          
          # Esegui i test nel container con volume mapping per estrarre i report
          docker run \
            -e CORE_GRAPHQL_API_URL \
            -e CORE_GRAPHQL_API_KEY \
            -e CCT_GRAPHQL_API_URL \
            -e CCT_GRAPHQL_API_KEY \
            -e COGNITO_REGION \
            -e COGNITO_CLIENT_ID \
            -e AWS_REGION \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TWILIO_ACCOUNT_SID \
            -e TWILIO_AUTH_TOKEN \
            -e GMAIL_CLIENT_ID \
            -e GMAIL_CLIENT_SECRET \
            -e GMAIL_REFRESH_TOKEN \
            -e APP_BRAND \
            -e NODE_ENV \
            -v $(pwd)/test-reports-${{ matrix.app_brand }}:/app/test-reports \
            petlink-everywhere-test yarn pipeline:$NODE_ENV

      # Pubblica JUnit report per annotazioni su PR
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: 'test-reports-${{ matrix.app_brand }}/junit.xml'
          check_name: "Report integration test (${{ env.NODE_ENV }} - ${{ matrix.app_brand }})"
          fail_on_failure: true
          require_tests: true
          # Summary (pagina "Summary" del run su Actions)
          job_summary: true
          detailed_summary: true
          verbose_summary: true
          group_suite: true
          # Check (pagina dedicata del "Check" creato dall’action, visibile anche in PR)
          annotations_limit: 200
          include_passed: false

      # Add Performance Report to Summary
      - name: Add Performance Report to Summary
        if: always()
        run: |
          if [ -f "test-reports-${{ matrix.app_brand }}/performance-report.txt" ]; then
            echo "## 🚀 Performance Report (${{ matrix.app_brand }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-reports-${{ matrix.app_brand }}/performance-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Performance report not found" >> $GITHUB_STEP_SUMMARY
          fi
