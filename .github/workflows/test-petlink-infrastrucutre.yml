name: test-petlink-infrastrucutre

on:
  push:
    branches: [develop]
  repository_dispatch:
    types: [backend-updated]
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to test against"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - test

jobs:
  run-integration-tests:
    runs-on: ubuntu-latest
    # 1. If repository_dispatch: use branch where other repos has pushed
    # 2. If workflow_dispatch: use value chosen manually
    # 3. Default 'develop'
    environment: ${{ github.event.client_payload.branch || github.event.inputs.environment || 'develop' }}

    env:
      # 1. If repository_dispatch: use branch where other repos has pushed
      # 2. If workflow_dispatch: use value chosen manually
      # 3. Default 'develop'
      NODE_ENV: ${{ github.event.client_payload.branch || github.event.inputs.environment || 'develop' }}
      # Core API
      CORE_GRAPHQL_API_URL: ${{ secrets.CORE_GRAPHQL_API_URL }}
      CORE_GRAPHQL_API_KEY: ${{ secrets.CORE_GRAPHQL_API_KEY }}
      # CCT API
      CCT_GRAPHQL_API_URL: ${{ secrets.CCT_GRAPHQL_API_URL }}
      CCT_GRAPHQL_API_KEY: ${{ secrets.CCT_GRAPHQL_API_KEY }}
      # AWS Cognito
      COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
      COGNITO_CLIENT_ID: ${{ secrets.COGNITO_CLIENT_ID }}
      # AWS IAM
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      # Twilio
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      # Gmail
      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
      # App Brand
      APP_BRAND: ${{ matrix.app_brand }}

    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        app_brand: [PETLINK, KIPPY]

    permissions:
      checks: write
      pull-requests: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Add Trigger Info to Summary
        run: |
          echo "## 🔔 Test Suite Execution Info" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "**Triggered by:** \`repository_dispatch\` (push on external repos)" >> $GITHUB_STEP_SUMMARY
            echo "**Repository:** [\`${{ github.event.client_payload.repo }}\`](https://github.com/${{ github.event.client_payload.repo }})" >> $GITHUB_STEP_SUMMARY
            echo "**Source Branch:** \`${{ github.event.client_payload.branch }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Target Environment:** \`${{ env.NODE_ENV }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.event.client_payload.repo }}/commit/${{ github.event.client_payload.sha }})" >> $GITHUB_STEP_SUMMARY
            echo "**Commit Author:** [@${{ github.event.client_payload.actor }}](https://github.com/${{ github.event.client_payload.actor }})" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "**Triggered by:** \`workflow_dispatch\` (manual trigger)" >> $GITHUB_STEP_SUMMARY
            echo "**Repository:** \`${{ github.repository }}\` (this repo)" >> $GITHUB_STEP_SUMMARY
            echo "**Source Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Target Environment:** \`${{ env.NODE_ENV }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
            echo "**Commit Author:** [@${{ github.actor }}](https://github.com/${{ github.actor }})" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "**Triggered by:** \`push\` (push on this repo)" >> $GITHUB_STEP_SUMMARY
            echo "**Repository:** \`${{ github.repository }}\` (this repo)" >> $GITHUB_STEP_SUMMARY
            echo "**Source Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Target Environment:** \`${{ env.NODE_ENV }}\`" >> $GITHUB_STEP_SUMMARY
            echo "**Commit:** [\`${GITHUB_SHA:0:7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }})" >> $GITHUB_STEP_SUMMARY
            echo "**Commit Author:** [@${{ github.actor }}](https://github.com/${{ github.actor }})" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

      - name: Log trigger info
        run: |
          echo "Triggered by: ${{ github.event_name }}"
          echo "Repository: ${{ github.event.client_payload.repo || 'self' }}"
          echo "Branch: ${{ github.event.client_payload.ref || github.ref }}"
          echo "Commit: ${{ github.event.client_payload.sha || github.sha }}"
          echo "Actor: ${{ github.event.client_payload.actor || github.actor }}"
          echo "Brand: ${{ matrix.app_brand }}"
          echo "Environment: ${{ env.NODE_ENV }}"

      - name: Build Docker image
        run: docker build -t petlink-everywhere-test .

      - name: Run integration tests (${{ matrix.app_brand }} on env ${{ env.NODE_ENV }})
        run: |
          # Crea directory per estrarre i report (separata per ogni brand)
          mkdir -p ./test-reports-${{ matrix.app_brand }}

          # Esegui i test nel container con volume mapping per estrarre i report
          docker run \
            -e CORE_GRAPHQL_API_URL \
            -e CORE_GRAPHQL_API_KEY \
            -e CCT_GRAPHQL_API_URL \
            -e CCT_GRAPHQL_API_KEY \
            -e COGNITO_REGION \
            -e COGNITO_CLIENT_ID \
            -e AWS_REGION \
            -e AWS_ACCESS_KEY_ID \
            -e AWS_SECRET_ACCESS_KEY \
            -e TWILIO_ACCOUNT_SID \
            -e TWILIO_AUTH_TOKEN \
            -e GMAIL_CLIENT_ID \
            -e GMAIL_CLIENT_SECRET \
            -e GMAIL_REFRESH_TOKEN \
            -e APP_BRAND \
            -e NODE_ENV \
            -v $(pwd)/test-reports-${{ matrix.app_brand }}:/app/test-reports \
            petlink-everywhere-test yarn pipeline:$NODE_ENV

      # Pubblica JUnit report per annotazioni su PR
      - name: Publish Test Results
        uses: mikepenz/action-junit-report@v5
        if: always()
        with:
          report_paths: "test-reports-${{ matrix.app_brand }}/junit.xml"
          check_name: "Report integration test (${{ matrix.app_brand }} on env ${{ env.NODE_ENV }})"
          fail_on_failure: true
          require_tests: true
          # Summary (pagina "Summary" del run su Actions)
          job_summary: true
          detailed_summary: true
          verbose_summary: true
          group_suite: true
          # Check (pagina dedicata del "Check" creato dall’action, visibile anche in PR)
          annotations_limit: 200
          include_passed: false

      # Add Skipped Tests Report to Summary
      - name: Add Skipped Tests Report to Summary
        if: always()
        run: |
          if [ -f "test-reports-${{ matrix.app_brand }}/junit.xml" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ⏭️ Skipped Tests (${{ matrix.app_brand }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
          
            # Conta i test skippati (escludendo i testcase con nome uguale al file)
            SKIPPED_COUNT=$(awk '
              /<testcase/ { in_testcase=1; testcase_line=$0 }
              /<skipped/ && in_testcase {
                if (testcase_line !~ /name="src\/tests\//) count++
              }
              /<\/testcase>/ { in_testcase=0 }
              END { print count+0 }
            ' test-reports-${{ matrix.app_brand }}/junit.xml)
          
            if [ "$SKIPPED_COUNT" -eq "0" ]; then
              echo "✅ **No tests were skipped**" >> $GITHUB_STEP_SUMMARY
            else
              echo "**Total skipped: $SKIPPED_COUNT tests**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
          
              # Estrai e raggruppa per file
              awk '
                /<testcase/ {
                  # Salva la riga del testcase
                  testcase_line = $0
                  in_testcase = 1
                }
                /<skipped/ && in_testcase {
                  # Controlla che non sia un testcase "fake" (nome = file path)
                  if (testcase_line !~ /name="src\/tests\//) {
                    # Estrai classname e name
                    match(testcase_line, /classname="([^"]*)"/, class)
                    match(testcase_line, /name="([^"]*)"/, name)
          
                    file = class[1]
                    test = name[1]
          
                    # Decodifica HTML entities
                    gsub(/&gt;/, ">", test)
                    gsub(/&lt;/, "<", test)
                    gsub(/&amp;/, "\\&", test)
                    gsub(/&apos;/, "'"'"'", test)
                    gsub(/&quot;/, "\"", test)
          
                    # Raggruppa per file
                    if (file != last_file) {
                      if (last_file != "") print ""
                      print "**" file "**"
                      last_file = file
                    }
          
                    # Stampa test
                    print "- _" test "_"
                  }
                }
                /<\/testcase>/ {
                  in_testcase = 0
                }
              ' test-reports-${{ matrix.app_brand }}/junit.xml >> $GITHUB_STEP_SUMMARY
          
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "_💡 Tests are skipped when brand-specific conditions are not met (KIPPY-only or PETLINK-only features) or marked as TODO_" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "## ⏭️ Skipped Tests (${{ matrix.app_brand }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "⚠️ JUnit XML not found - cannot extract skipped tests details" >> $GITHUB_STEP_SUMMARY
          fi

      # Add Performance Report to Summary
      - name: Add Performance Report to Summary
        if: always()
        run: |
          if [ -f "test-reports-${{ matrix.app_brand }}/performance-report.txt" ]; then
            echo "## 🚀 Performance Report (${{ matrix.app_brand }})" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat test-reports-${{ matrix.app_brand }}/performance-report.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Performance report not found" >> $GITHUB_STEP_SUMMARY
          fi
