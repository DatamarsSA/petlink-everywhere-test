overwrite: true

generates:
  src/clients/petlink-infrastructure/endpoints/generated/core_schema.ts: # File di output
    schema: ./src/clients/petlink-infrastructure/endpoints/graphql/core_schema.graphql # Schema GraphQL di input
    documents: ./src/clients/petlink-infrastructure/endpoints/operations/core/*.graphql # Operazioni GraphQL definite manualmente
    plugins:
      - typescript  # Genera tipi TypeScript
      - typescript-operations  # Genera tipi per le operazioni
      - typescript-graphql-request  # Genera l'SDK basato su graphql-request

  src/clients/petlink-infrastructure/endpoints/generated/cct_schema.ts:
    schema: ./src/clients/petlink-infrastructure/endpoints/graphql/cct_schema.graphql
#    documents: ./src/clients/petlink-infrastructure/endpoints/operations/cct/*.graphql
    plugins:
      - typescript
      - typescript-operations
      - typescript-graphql-request

config:
  documentMode: 'documentNode'
  declarationKind:
    type: 'interface'
    input: 'interface'
  scalars:
    AWSDate: AWSDate
    AWSTime: AWSTime
    AWSDateTime: AWSDateTime
    AWSTimestamp: AWSTimestamp
    AWSEmail: AWSEmail
    AWSURL: AWSURL
    AWSPhone: AWSPhone
    AWSIPAddress: AWSIPAddress
    BigInt: BigInt
    Double: Double
  enumsAsTypes: true

hooks:
  afterOneFileWrite:
    - prettier --write
