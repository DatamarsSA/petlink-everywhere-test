overwrite: true

generates:
  src/lib/generated/core_schema.ts:
    schema: ./schema/graphql/core_schema.graphql
    documents: ./schema/operations/core/*.graphql
    plugins:
      - typescript
      - typescript-operations
      - typescript-graphql-request

  src/lib/generated/cct_schema.ts:
    schema: ./schema/graphql/cct_schema.graphql
   # documents: ./schema/operations/cct/*.graphql
    plugins:
      - typescript
      - typescript-operations
      - typescript-graphql-request

config:
  documentMode: 'documentNode'
  declarationKind:
    type: 'interface'
    input: 'interface'
  scalars:
    AWSDate: AWSDate
    AWSTime: AWSTime
    AWSDateTime: AWSDateTime
    AWSTimestamp: AWSTimestamp
    AWSEmail: AWSEmail
    AWSURL: AWSURL
    AWSPhone: AWSPhone
    AWSIPAddress: AWSIPAddress
    BigInt: BigInt
    Double: Double
  enumsAsTypes: true

hooks:
  afterOneFileWrite:
    - prettier --write
