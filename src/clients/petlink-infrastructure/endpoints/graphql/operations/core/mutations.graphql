mutation createPetlinkGps($petlinkGps: PetlinkGpsIn!, $appBrand: AppBrand!) {
  createPetlinkGps(petlinkGps: $petlinkGps, appBrand: $appBrand) {
    code
    translationCode
    message
    petlinkGps {
      id
      entityType
      serialNumber
      petId
      userId
      creationDate
      updateDate
      countryCode
      timezone
      lastKnownPosition {
        lat
        lng
        alt
        radius
        speed
        positionType
        date
      }
      lastKnownStatus {
        battery
        flashlight
        sound
        liveTracking
        geofence
        inGeofence
        energySavingMode
        inEnergySavingZone
        firmwareVersion
        offline
        date
      }
      geofenceCoordinates {
        lat
        lng
      }
      newFirmwareVersion {
        url
        version
      }
      settings {
        activityProfile
        updateFrequency
        enableGpsOnDefault
        optimizationDone
      }
    }
    currentTermEnd
    url
  }
}

