
mutation sendOtp($phone: String!, $languageId: LanguageId) {
    sendOtp(phone: $phone, languageId: $languageId) {
        code
        translationCode
        message
        verificationId
    }
}
mutation checkOtp($verificationId: String!, $otp: String!, $contact: String!) {
    checkOtp(verificationId: $verificationId, otp: $otp, contact: $contact) {
        code
        translationCode
        message
        verificationId
    }
}
mutation signUpUser($user: UserIn!, $otpData: OtpInput!, $languageId: LanguageId, $appBrand: AppBrand) {
    signUpUser(user: $user, otpData: $otpData, languageId: $languageId, appBrand: $appBrand) {
        code
        translationCode
        message
    }
}
