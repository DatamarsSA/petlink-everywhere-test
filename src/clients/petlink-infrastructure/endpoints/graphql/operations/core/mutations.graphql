}

mutation resetPetlinkGps($id: String!) {
  resetPetlinkGps(id: $id) {
    code
    translationCode
    message
  }
}

mutation updateBillingInfo($updateBillingInfoInput: UpdateBillingInfoInput!) {
  updateBillingInfo(updateBillingInfoInput: $updateBillingInfoInput) {
    code
    translationCode
    message
  }
}

mutation updatePetProtectionData(
  $petProtectionId: String!
  $owner: PetProtectionOwnerIn!
  $pet: PetProtectionPetIn!
) {
  updatePetProtectionData(
    petProtectionId: $petProtectionId
    owner: $owner
    pet: $pet
  ) {
    code
    translationCode
    message
    petProtection {
      id
      petId
      userId
      chargebeeSubscriptionId
      currentTermStart
      currentTermEnd
      status
      petOwner {
        name
        surname
        email
        fiscalCode
        city
        zipCode
        streetAddress
        countryCode
        provinceCode
        homePhone
        mobilePhone
      }
      pet {
        species
        breed
        gender
        name
        birthDate
        microchip
      }
      petFlag {
        country
        age
      }
      codiceTessera
      fileName
      name
      price
      currencyCode
      period
      periodUnit
      reservedCoupon
      reservedCouponPercent
      customerServiceContact
      card {
        expiryMonth
        expiryYear
        maskedNumber
        type
        brand
        paymentMethod
      }
    }
  }
}

mutation stopRenewingSubscription(
  $subscriptionId: String!
  $appBrand: AppBrand!
  $cancelReason: String!
  $cancelReasonCode: CancelReasonCodeEnum!
) {
  stopRenewingSubscription(
    subscriptionId: $subscriptionId
    appBrand: $appBrand
    cancelReason: $cancelReason
    cancelReasonCode: $cancelReasonCode
  ) {
    code
    translationCode
    message
  }
}
