query getPetlinkGps($id: String!) {
  getPetlinkGps(id: $id) {
    code
    translationCode
    message
    petlinkGps {
      id
      entityType
      serialNumber
      petId
      userId
      creationDate
      updateDate
      countryCode
      timezone
      lastKnownPosition {
        lat
        lng
        alt
        radius
        speed
        positionType
        date
      }
      lastKnownStatus {
        battery
        flashlight
        sound
        liveTracking
        geofence
        inGeofence
        energySavingMode
        inEnergySavingZone
        firmwareVersion
        offline
        date
      }
      geofenceCoordinates {
        lat
        lng
      }
      newFirmwareVersion {
        version
        url
      }
      settings {
        activityProfile
        updateFrequency
        enableGpsOnDefault
        optimizationDone
      }
      subscriptionId
      subscriptionIsActive
      logEnabled
    }
