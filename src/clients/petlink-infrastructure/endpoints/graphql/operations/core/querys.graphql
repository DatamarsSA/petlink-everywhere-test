      }
      pet {
        species
        breed
        gender
        name
        birthDate
        microchip
      }
      petFlag {
        country
        age
      }
      codiceTessera
      fileName
      name
      price
      currencyCode
      period
      periodUnit
      reservedCoupon
      reservedCouponPercent
      customerServiceContact
