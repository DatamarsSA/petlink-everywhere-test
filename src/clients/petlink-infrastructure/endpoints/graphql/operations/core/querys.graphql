}

query getColors($species: SpeciesEnum!, $languageId: LanguageId) {
  getColors(species: $species, languageId: $languageId) {
    code
    message
    translationCode
    items {
      code
      name
    }
  }
}

query getBreed($species: SpeciesEnum!, $languageId: LanguageId) {
  getBreed(species: $species, languageId: $languageId) {
    code
    message
    translationCode
    items {
      breedName
      code
      species
    }
  }
}

query getPetlinkGps($id: String!) {
  getPetlinkGps(id: $id) {
    code
    translationCode
    message
    petlinkGps {
      id
      entityType
      serialNumber
      petId
      userId
      creationDate
      updateDate
      countryCode
      timezone
      lastKnownPosition {
        lat
        lng
        alt
        radius
        speed
        positionType
        date
      }
      lastKnownStatus {
        battery
        flashlight
        sound
        liveTracking
        geofence
        inGeofence
        energySavingMode
        inEnergySavingZone
        firmwareVersion
        offline
        date
      }
      geofenceCoordinates {
        lat
        lng
      }
      newFirmwareVersion {
        version
        url
      }
      settings {
        activityProfile
        updateFrequency
        enableGpsOnDefault
        optimizationDone
      }
      subscriptionId
      subscriptionIsActive
      logEnabled
    }
  }
}

query getSubscriptionPlans(
  $productId: String
  $countryCode: String
  $serialNumber: String
) {
  getSubscriptionPlans(
    productId: $productId
    countryCode: $countryCode
    serialNumber: $serialNumber
  ) {
    code
    translationCode
    message
    plans {
      itemId
      pricings {
        addonPricings {
          id
          name
          externalName
          itemId
          price
          period
          currencyCode
          periodUnit
          itemFamilyId
          status
          trialPeriod
          trialPeriodUnit
        }
        id
        name
        externalName
        itemId
        price
        period
        currencyCode
        periodUnit
        itemFamilyId
        status
        trialPeriod
        trialPeriodUnit
      }
    }
    careProtectionPlans {
      itemId
      pricings {
        id
        name
        externalName
        itemId
        price
        period
        currencyCode
        periodUnit
        itemFamilyId
        status
        trialPeriod
        trialPeriodUnit
      }
    }
    trialDuration
    paymentMethodRequired
    coupon {
      id
      name
      discountType
      discountPercentage
      discountAmount
      discountQuantity
      currencyCode
    }
  }
}

query getBillingInfo {
