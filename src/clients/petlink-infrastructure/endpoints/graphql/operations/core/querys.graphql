#FORGOT/RECOVERY flows (public - NO auth)

mutation sendOtpForgotPassword($contact: String!, $languageId: LanguageId, $appBrand: AppBrand!) {
  sendOtpForgotPassword(contact: $contact, languageId: $languageId, appBrand: $appBrand) {
    code
    translationCode
    message
    verificationId
  }
}

mutation changeForgotPassword($otp: String!, $verificationId: String!, $password: String!) {
  changeForgotPassword(otp: $otp, verificationId: $verificationId, password: $password) {
    code
    translationCode
    message
  }
}
