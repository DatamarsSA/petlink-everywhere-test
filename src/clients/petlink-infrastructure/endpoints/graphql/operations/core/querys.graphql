query getSubscriptionByProductId($productId: String!) {
  getSubscriptionByProductId(productId: $productId) {
    code
    translationCode
    message
    subscription {
      id
      status
      currentTermStart
      currentTermEnd
      nextBillingAt
      card {
        expiryMonth
        expiryYear
        maskedNumber
        type
        brand
        paymentMethod
      }
      currencyCode
      paymentStatus
      planChangeNotAllowed
      subscriptionItems {
        amount
        name
        itemPriceId
        itemType
        quantity
        unitPrice
        itemId
      }
      billingPeriod
      billingPeriodUnit
      addonToStopIds
    }
  }
}

