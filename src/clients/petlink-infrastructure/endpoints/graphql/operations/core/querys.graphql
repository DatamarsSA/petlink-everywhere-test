query getSubscriptionPlanPricing(
  $planPriceId: String!
  $careProtectionPlanId: String
  $addonPriceIds: [String!]
  $countryCode: String!
  $productId: String!
) {
  getSubscriptionPlanPricing(
    planPriceId: $planPriceId
    careProtectionPlanId: $careProtectionPlanId
    addonPriceIds: $addonPriceIds
    countryCode: $countryCode
    productId: $productId
  ) {
    code
    translationCode
    message
    pricing {
      id
      name
      externalName
      itemId
      price
      period
      currencyCode
      periodUnit
      itemFamilyId
      status
      trialPeriod
      trialPeriodUnit
    }
    careProtectionPricing {
      id
      name
      externalName
      itemId
      price
      period
      currencyCode
      periodUnit
      itemFamilyId
      status
      trialPeriod
      trialPeriodUnit
    }
    trialDuration
    paymentMethodRequired
    coupon {
      id
      name
      discountType
      discountPercentage
      discountAmount
      discountQuantity
      currencyCode
    }
  }
}

query getSubscriptionByProductId($productId: String!) {
  getSubscriptionByProductId(productId: $productId) {
    code
    translationCode
    message
    subscription {
      id
      status
      currentTermStart
      currentTermEnd
      nextBillingAt
      card {
        expiryMonth
        expiryYear
        maskedNumber
        type
        brand
        paymentMethod
      }
      currencyCode
      paymentStatus
      planChangeNotAllowed
      subscriptionItems {
        amount
        name
        itemPriceId
        itemType
        quantity
        unitPrice
        itemId
      }
      billingPeriod
      billingPeriodUnit
      addonToStopIds
    }
  }
}

query getPetProtection($petProtectionId: String!) {
  getPetProtection(petProtectionId: $petProtectionId) {
