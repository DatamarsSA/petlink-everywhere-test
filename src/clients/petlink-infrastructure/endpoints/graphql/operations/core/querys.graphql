}

query getSubscriptionPlans($productId: String, $countryCode: String, $serialNumber: String) {
  getSubscriptionPlans(productId: $productId, countryCode: $countryCode, serialNumber: $serialNumber) {
    code
    translationCode
    message
    plans {
      itemId
      pricings {
        addonPricings {
          id
          name
          externalName
          itemId
          price
          period
          currencyCode
          periodUnit
          itemFamilyId
          status
          trialPeriod
          trialPeriodUnit
        }
        id
        name
        externalName
        itemId
        price
        period
        currencyCode
        periodUnit
        itemFamilyId
        status
        trialPeriod
        trialPeriodUnit
      }
    }
    careProtectionPlans {
      itemId
      pricings {
        id
        name
        externalName
        itemId
        price
        period
        currencyCode
        periodUnit
        itemFamilyId
        status
        trialPeriod
        trialPeriodUnit
      }
    }
    trialDuration
    paymentMethodRequired
    coupon {
      id
      name
      discountType
      discountPercentage
      discountAmount
      discountQuantity
      currencyCode
    }
  }
}

