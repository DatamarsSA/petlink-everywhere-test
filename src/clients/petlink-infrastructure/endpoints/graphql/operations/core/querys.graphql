query getUser {
  getUser {
    code
    message
    translationCode
    user {
      birthDate
      chargebeeId
      city
      contactVerified {
        email
        phone
      }
      countryCode
      creationDate
      email
      entityType
      haveMicrochip
      gender
      id
      image {
        id
        url
      }
      languageId
      name
      mobileDevices {
        os
        registrationToken
        serialNumber
      }
      notificationSettings {
        email
        energySavingZone {
          push
        }
        push
        sms
      }
      phone
      safetyTermsCat
      settings {
        liveDistance
        liveSpeed
        liveTrack
      }
      stateCode
      streetAddress
      surname
      timezone
      updateDate
      zipCode
    }
  }
}

query checkContact($contact: String!, $contactType: ContactType!, $appBrand: AppBrand!) {
  checkContact(contact: $contact, contactType: $contactType, appBrand: $appBrand) {
    code
    translationCode
    message
  }
}

query getPet($id: String!) {
  getPet(id: $id) {
    code
    translationCode
    message
    pet {
      id
      name
      birthDate
      species
      breedType
      breeds
      gender
      primaryColor
      weight
      userId
      creationDate
      updateDate
      neutered
      length
      dateMarkedAsLost
      petProtectionId
    }
  }
}

