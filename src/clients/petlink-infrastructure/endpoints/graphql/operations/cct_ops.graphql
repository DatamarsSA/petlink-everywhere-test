query getSubscriptions($deviceId: String!, $pagination: PaginationInput, $order: OrderInput) {
    getSubscriptions(deviceId: $deviceId, pagination: $pagination, order: $order) {
        code
        message
        translationCode
        items {
            id
            orderId
            entityType
            planChangeNotAllowed
            userId
            productId
            serialNumber
            chargebeeSubscriptionId
            billingPeriod
            billingPeriodUnit
            status
            paymentStatus
            dunningAttempts {
                attempt
                createdAt
                transactionId
                status
            }
            nextPaymentRetryAt
            card {
                expiryMonth
                expiryYear
                maskedNumber
                type
                brand
                paymentMethod
            }
            currencyCode
            currentTermStart
            currentTermEnd
            trialStart
            trialEnd
            nextBillingAt
            createdAt
            startedAt
            activatedAt
            updatedAt
            cancelledAt
            cancelReason
            cancelReasonCode
            businessEntityId
            subscriptionItems {
                amount
                quantity
                name
                unitPrice
                itemType
                itemPriceId
                itemId
            }
            invoices {
                id
                entityType
                userId
                subscriptionId
                status
                businessEntityId
                chargebeeSubscriptionId
                chargebeeInvoiceId
                total
                currencyCode
                items {
                    chargebeeInvoiceItemId
                    amount
                    description
                    itemType
                    itemId
                    quantity
                    unitPrice
                    dateFrom
                    dateTo
                }
                discountItems {
                    chargebeeInvoiceItemId
                    amount
                    couponId
                    discountPercentage
                    discountType
                }
                billingAddress {
                    city
                    country
                    email
                    firstName
                    lastName
                    address
                    phone
                    state
                    zip
                }
                creationDate
                updateDate
                notes
                card {
                    expiryMonth
                    expiryYear
                    maskedNumber
                    type
                    brand
                    paymentMethod
                }
            }
            creditNotes {
                id
                entityType
                serialNumber
                chargebeeSubscriptionId
                chargebeeInvoiceId
                chargebeeCreditNoteId
                subscriptionId
                invoiceId
                productId
                refundItems {
                    amount
                    chargebeeInvoiceItemId
                }
                refundReason
                status
                total
                refundedAt
                currencyCode
                customerId
                userId
                username
                creationDate
                updateDate
            }
            note
            moved
            movedFrom
            creationDate
            updateDate
            imei
            addedFreePeriod
            totalDeviceProtectionReplacements
            availableDeviceProtectionReplacements
            addonToStopIds
            retentionCoupon {
                amount
                couponId
                couponName
                discountPercentage
                discountType
            }
            scheduledChanges {
                billingPeriod
                billingPeriodUnit
                currencyCode
                createdAt
                updatedAt
                currentTermStart
                currentTermEnd
                items {
                    amount
                    quantity
                    name
                    unitPrice
                    itemType
                    itemPriceId
                    itemId
                }
            }
        }
        pagination {
            pageSize
            totalPage
            totalItems
            currentPage
        }
    }
}

