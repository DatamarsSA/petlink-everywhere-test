###################### QUERY ######################
query getCustomer($customerId: String!) {
    getCustomer(customerId: $customerId) {
        code
        message
        translationCode
        customer {
            id
            name
            surname
            email
            emailConfirmed
            phone
            phoneConfirmed
            language
            registrationDate
            countryCode
            chargebeeId
            appBrand
        }
    }
}

mutation utilityIntegrationTest($input: UtilityIntegrationTestInput!) {
    utilityIntegrationTest(input: $input) {
        code
        message
    }
}

query getCustomers($filter: GetCustomersInput, $pagination: PaginationInput, $order: OrderInput) {
    getCustomers(filter: $filter, pagination: $pagination, order: $order) {
        code
        message
        translationCode
        items {
            id
            name
            surname
            email
            emailConfirmed
            phone
            phoneConfirmed
            language
            registrationDate
            countryCode
            chargebeeId
            appBrand
        }
        pagination {
            pageSize
            totalPage
            totalItems
            currentPage
        }
    }
}

