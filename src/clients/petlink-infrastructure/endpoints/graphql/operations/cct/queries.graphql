query getPet($petId: String!) {
  getPet(petId: $petId) {
    code
    message
    pet {
      id
      name
      birthDate
      species
      breedType
      breeds
      gender
      primaryColor
      weight
      userId
      creationDate
      updateDate
      neutered
      length
      dateMarkedAsLost
      activityProfile
      hidden
      petProtection {
        id
        currentTermStart
        currentTermEnd
        status
        name
      }
    }
  }
}

query customGetCustomerDevices($customerId: String!) {
  getDevices(
    filter: { customerId: $customerId, filterType: OR }
    pagination: { pageNumber: 0, pageSize: 1000 }
    order: { field: "serialId", order: asc }
  ) {
    code
    message
    items {
      serialId
      deviceId
      petId
      customerId
      hasSubscriptionActive
    }
  }
}

query getCustomDeviceSubscriptions($deviceId: String!) {
  getSubscriptions(
    deviceId: $deviceId
    pagination: { pageNumber: 0, pageSize: 1000000 }
    order: { field: "creationDate", order: desc }
  ) {
    code
    message
    items {
      id
      chargebeeSubscriptionId
      entityType
      status
      paymentStatus
      currencyCode
      currentTermStart
      currentTermEnd
      createdAt
      startedAt
      activatedAt
      updatedAt
      cancelledAt
      subscriptionItems {
        amount
        billingCycles
        name
        itemPriceId
        itemId
        itemType
        quantity
        unitPrice
      }
      invoice {
        status
        businessEntityId
        currencyCode
        creationDate
        updateDate
        notes
      }
      note
      moved
      creationDate
      updateDate
    }
  }
}
