query getCustomer($customerId: String!) {
  getCustomer(customerId: $customerId) {
    code
    message
    customer {
      id
      name
      surname
      email
      emailConfirmed
      phone
      phoneConfirmed
      language
      countryCode
      appBrand
    }
  }
}

query getCustomers($filter: GetCustomersInput, $pagination: PaginationInput, $order: OrderInput) {
  getCustomers(filter: $filter, pagination: $pagination, order: $order) {
    code
    message
    items {
      id
      name
      surname
      email
      emailConfirmed
      phone
      phoneConfirmed
      language
      registrationDate
      countryCode
      chargebeeId
      appBrand
    }
    pagination {
      pageSize
      totalPage
      totalItems
      currentPage
    }
  }
}

query getDevices($filter: GetDevicesInput, $pagination: PaginationInput, $order: OrderInput) {
